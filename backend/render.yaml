services:
  - type: web
    name: xmmhf-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: xmmhf-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false  # Set to your Vercel frontend URL
      - key: GEMINI_API_KEY
        sync: false  # Set in Render dashboard
      - key: GITHUB_TOKEN
        sync: false  # Set in Render dashboard (optional)

databases:
  - name: xmmhf-db
    databaseName: xmmhf
    user: xmmhf_user
    plan: free
